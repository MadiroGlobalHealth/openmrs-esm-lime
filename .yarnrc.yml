approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

# @carbon/react asks for `sass` to compile its SCSS; these apps build with the
# openmrs CLI, which brings its own sass-embedded, so the peer is optional here.
packageExtensions:
  "@carbon/react@*":
    peerDependenciesMeta:
      sass:
        optional: true

yarnPath: .yarn/releases/yarn-4.18.1.cjs
