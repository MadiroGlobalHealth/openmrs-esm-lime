name: Node CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types:
      - created
  # Manual runs publish a pre-release from the chosen branch (used to test publishing).
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Cache dependencies
        id: cache
        uses: actions/cache@v6
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: yarn install --immutable

      - name: Run lint, type checks and tests
        run: yarn verify

      - name: Run build
        run: yarn turbo run build --concurrency=5

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            packages/**/dist
          overwrite: true

  pre_release:
    runs-on: ubuntu-latest

    needs: build

    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

    # npm trusted publishing: Yarn exchanges the GitHub OIDC token for a
    # short-lived publish token, so no NPM_AUTH_TOKEN secret is needed.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Cache dependencies
        id: cache
        uses: actions/cache@v6
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: yarn install --immutable

      - name: Version
        run: yarn workspaces foreach --worktree --topological --exclude @madiro/openmrs-esm-lime version "$(node -e "console.log(require('semver').inc(require('./package.json').version, 'patch'))")-pre.${{ github.run_number }}"

      - name: Build
        run: yarn turbo run build --concurrency=5

      - run: git config user.email "info@openmrs.org" && git config user.name "OpenMRS CI"
      - run: git add . && git commit -m "Prerelease version" --no-verify

      - name: Pre-release
        run: yarn run ci:prepublish

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            packages/**/dist
          overwrite: true

  release:
    runs-on: ubuntu-latest

    needs: build

    if: ${{ github.event_name == 'release' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Cache dependencies
        id: cache
        uses: actions/cache@v6
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: yarn install --immutable

      - run: yarn turbo run build --color
      - run: yarn run ci:publish
